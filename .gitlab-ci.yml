# Pathly GitLab CI/CD components — repo CI
# https://pathlyhq.com · https://pathlyhq.com/en/developers

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .pip/

test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --upgrade pip
    - pip install -r requirements-dev.txt
    - pytest -q --cov=pathly_api --cov=pathly_cli --cov-report=term-missing --cov-report=xml --cov-fail-under=100
  coverage: '/TOTAL.*?(\d+)%/'
  artifacts:
    when: always
    paths:
      - coverage.xml
      - htmlcov/
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
