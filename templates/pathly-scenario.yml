# Pathly CI/CD Component — create/ensure HTTP scenario
# Product: https://pathlyhq.com · Docs: https://pathlyhq.com/en/developers
#
# include:
#   - remote: https://raw.githubusercontent.com/Pathlyhq/pathly-gitlab-ci/v0.1.0/templates/pathly-scenario.yml
#     inputs:
#       scenario_url: "https://www.example.com/"
#
# Requires CI/CD variable PATHLY_API_TOKEN (masked) with scenarios:write.

spec:
  inputs:
    stage:
      default: deploy
      description: Pipeline stage for ensuring a Pathly HTTP scenario
    api_token:
      default: $PATHLY_API_TOKEN
      description: Pathly API token (sp_…). Prefer a masked CI/CD variable.
    api_url:
      default: "https://api.pathlyhq.com"
      description: Pathly API base URL
    scenario_name:
      default: "CI HTTP check"
      description: Scenario display name in Pathly
    scenario_url:
      description: URL to monitor (HTTPS public endpoint)
    interval_sec:
      default: "300"
      description: Check interval in seconds
    severity:
      default: major
      description: Pathly severity (minor|major|critical)
    job_name:
      default: pathly-scenario
      description: Job name
---
"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: python:3.12-slim
  variables:
    PATHLY_API_TOKEN: $[[ inputs.api_token ]]
    PATHLY_API_URL: $[[ inputs.api_url ]]
    PATHLY_SCENARIO_NAME: $[[ inputs.scenario_name ]]
    PATHLY_SCENARIO_URL: $[[ inputs.scenario_url ]]
    PATHLY_INTERVAL_SEC: $[[ inputs.interval_sec ]]
    PATHLY_SEVERITY: $[[ inputs.severity ]]
  script:
    - |
      set -euo pipefail
      python3 - <<'PY'
      import json, os, ssl, uuid, urllib.error, urllib.request

      token = os.environ.get("PATHLY_API_TOKEN", "").strip()
      if not token.startswith("sp_"):
          raise SystemExit("PATHLY_API_TOKEN missing or not an sp_ token")
      base = os.environ.get("PATHLY_API_URL", "https://api.pathlyhq.com").rstrip("/")
      name = os.environ["PATHLY_SCENARIO_NAME"]
      url = os.environ["PATHLY_SCENARIO_URL"]
      interval = int(os.environ.get("PATHLY_INTERVAL_SEC", "300"))
      severity = os.environ.get("PATHLY_SEVERITY", "major")

      def request(method, path, body=None):
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
              "User-Agent": "pathlyhq/pathly-gitlab-ci",
          }
          data = None
          if body is not None:
              headers["Content-Type"] = "application/json"
              headers["Idempotency-Key"] = f"glci-{uuid.uuid4()}"
              data = json.dumps(body).encode()
          req = urllib.request.Request(f"{base}{path}", data=data, headers=headers, method=method)
          try:
              with urllib.request.urlopen(req, context=ssl.create_default_context()) as resp:
                  raw = resp.read().decode()
          except urllib.error.HTTPError as e:
              raw = e.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Pathly {method} {path} failed HTTP {e.code}: {raw}")
          return json.loads(raw) if raw else {}

      listed = request("GET", "/v1/scenarios?limit=200")
      items = listed.get("items") or []
      existing = next((i for i in items if i.get("name") == name), None)
      if existing:
          print(json.dumps({"id": existing.get("id"), "name": name, "created": False}))
          print(f"Ensured Pathly scenario {existing.get('id')}", flush=True)
      else:
          created = request(
              "POST",
              "/v1/scenarios",
              {
                  "type": "http",
                  "name": name,
                  "url": url,
                  "intervalSec": interval,
                  "severity": severity,
                  "tags": ["ci", "gitlab"],
              },
          )
          print(json.dumps({"id": created.get("id"), "name": name, "created": True}))
          print(f"Created Pathly scenario {created.get('id')}", flush=True)
      PY
  rules:
    - when: on_success
